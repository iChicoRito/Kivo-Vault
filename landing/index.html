<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kivo keeps your notes, links, files and passwords in one place, on your own computer. Free for Windows." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Kivo — everything important, in one place</title>
    <script>
      // Runs before paint so the page never flashes the wrong theme. Mirrors landing/theme.ts.
      try {
        var saved = localStorage.getItem('kivo.landing.theme')
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
