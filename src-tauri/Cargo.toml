[package]
name = "kivo"
version = "0.3.0"
description = "Kivo desktop archive"
authors = ["Kivo"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "kivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
arboard = { version = "3.6.1", default-features = false }
argon2 = "0.6"
base64 = "0.23"
dom_query = { version = "0.27", default-features = false }
getrandom = "0.2"
pdf-extract = "0.12.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
zeroize = "1"

# Windows Hello and DPAPI for device unlock; other platforms report it unavailable.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_WinRT",
] }
windows-future = "0.2"

# Vault keys use Argon2id at 64 MiB; unoptimized it makes debug builds and
# tests take seconds per unlock.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
